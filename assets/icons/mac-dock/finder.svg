<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Left Face Half Gradient -->
    <linearGradient id="macFaceLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38ef7d"/>
      <stop offset="40%" stop-color="#11998e"/>
      <stop offset="100%" stop-color="#0072ff"/>
    </linearGradient>
    
    <linearGradient id="finderCupertinoLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e0f2fe"/>
      <stop offset="40%" stop-color="#7dd3fc"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <!-- Right Face Half Gradient -->
    <linearGradient id="finderCupertinoRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#bae6fd"/>
      <stop offset="50%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>

    <filter id="finderShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Squircle Base Frame -->
  <rect x="40" y="40" width="432" height="432" rx="100" fill="#ffffff" filter="url(#finderShadow)"/>

  <!-- Left Face Split -->
  <path d="M 140,48 C 84,48 48,84 48,140 L 48,372 C 48,428 84,464 140,464 L 256,464 L 256,48 Z" fill="url(#finderCupertinoLeft)"/>

  <!-- Right Face Split -->
  <path d="M 256,48 L 372,48 C 428,48 464,84 464,140 L 464,372 C 464,428 428,464 372,464 L 256,464 Z" fill="url(#finderCupertinoRight)"/>

  <!-- Top Blue Accent Hair / Tab -->
  <path d="M 140,48 C 84,48 48,84 48,140 L 48,156 C 80,140 180,128 256,128 C 332,128 432,140 464,156 L 464,140 C 464,84 428,48 372,48 Z" fill="#0284c7" opacity="0.45"/>

  <!-- Eyes -->
  <ellipse cx="168" cy="204" rx="14" ry="24" fill="#0f172a"/>
  <ellipse cx="344" cy="204" rx="14" ry="24" fill="#0f172a"/>

  <!-- Nose Line -->
  <path d="M 256,192 L 256,268 L 284,268" stroke="#0f172a" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <!-- Smiling Mouth -->
  <path d="M 148,296 C 160,372 352,372 364,296" stroke="#0f172a" stroke-width="14" stroke-linecap="round" fill="none"/>

  <!-- Glass Sheen Overlay -->
  <path d="M 48,140 C 48,84 84,48 140,48 L 372,48 C 428,48 464,84 464,140 L 464,210 C 360,180 180,240 48,280 Z" fill="#ffffff" opacity="0.18"/>
</svg>
