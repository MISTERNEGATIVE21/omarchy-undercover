<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="safariBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e8e8ed"/>
    </linearGradient>
    <linearGradient id="compassBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00b4fc"/>
      <stop offset="100%" stop-color="#0062e0"/>
    </linearGradient>
    <filter id="safariShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect x="32" y="32" width="448" height="448" rx="105" fill="url(#safariBg)" filter="url(#safariShadow)"/>
  <circle cx="256" cy="256" r="180" fill="url(#compassBg)"/>
  <!-- Compass dial lines -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="#ffffff" stroke-width="4" stroke-opacity="0.4"/>
  <!-- Needle -->
  <polygon points="256,106 280,240 256,256 232,240" fill="#ff3b30"/>
  <polygon points="256,406 280,272 256,256 232,272" fill="#ffffff"/>
  <circle cx="256" cy="256" r="14" fill="#ffffff"/>
  <circle cx="256" cy="256" r="7" fill="#104f9b"/>
</svg>
