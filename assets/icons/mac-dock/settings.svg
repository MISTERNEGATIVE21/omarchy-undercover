<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="gearBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a8a9ad"/>
      <stop offset="100%" stop-color="#636366"/>
    </linearGradient>
    <filter id="gearShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect x="32" y="32" width="448" height="448" rx="105" fill="url(#gearBg)" filter="url(#gearShadow)"/>
  <!-- Gear shape -->
  <circle cx="256" cy="256" r="140" fill="#ffffff" fill-opacity="0.25"/>
  <circle cx="256" cy="256" r="85" fill="#48484a"/>
  <circle cx="256" cy="256" r="45" fill="url(#gearBg)"/>
</svg>
