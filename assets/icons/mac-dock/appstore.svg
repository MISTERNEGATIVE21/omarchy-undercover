  </defs>
  <rect x="32" y="32" width="448" height="448" rx="105" fill="url(#asBg)" filter="url(#asShadow)"/>
  <!-- App Store 'A' emblem formed by sticks -->
  <line x1="256" y1="120" x2="150" y2="360" stroke="#ffffff" stroke-width="36" stroke-linecap="round"/>
  <line x1="256" y1="120" x2="362" y2="360" stroke="#ffffff" stroke-width="36" stroke-linecap="round"/>
