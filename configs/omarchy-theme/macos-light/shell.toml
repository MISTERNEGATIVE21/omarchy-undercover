# Omarchy shell surfaces for macOS Sequoia Light.
# Configures QuickShell and Flea (Finder mode) typography, layout, and control styling.

[bar]
scale-with-font  = true
size-horizontal  = 28
size-vertical    = 28
background       = "#f5f5f7"
background-alpha = 0.88
text             = "#1d1d1f"
active           = "#0071e3"

[hyprland]
active-border            = "#0071e3"
active-border-foreground = "#515154"

[controls]
normal-color        = "#1d1d1f"
normal-fill-alpha   = 0.05
normal-border       = "#000000"
normal-border-width = 1
normal-border-alpha = 0.10

hover-cursor-color        = "#1d1d1f"
hover-cursor-fill-alpha   = 0.09
hover-cursor-border       = "#000000"
hover-cursor-border-width = 1
hover-cursor-border-alpha = 0.18

focus-color        = "#0071e3"
focus-fill-alpha   = 0.10
focus-border       = "#0071e3"
focus-border-width = 1
focus-border-alpha = 0.40

selected-color        = "#0071e3"
selected-fill-alpha   = 0.18
selected-border       = "#0071e3"
selected-border-width = 0
selected-border-alpha = 1.0

pressed-fill-alpha   = 0.22
selection-fill-alpha = 0.30

[spacing]
scale = 1.05
scale-with-font = true

[font]
base-size = 12

[popups]
background       = "#ffffff"
background-alpha = 0.94
text             = "#1d1d1f"
border           = "#000000"
border-alpha     = 0.12

[tooltip]
background       = "#ffffff"
background-alpha = 0.96
text             = "#1d1d1f"
border           = "#000000"
border-alpha     = 0.15

[notifications]
background       = "#ffffff"
background-alpha = 0.94
text             = "#1d1d1f"
border           = "#0071e3"
border-alpha     = 0.50
countdown        = "#0071e3"

[launcher]
background                = "#f5f5f7"
background-alpha          = 0.94
text                      = "#1d1d1f"
border                    = "#000000"
border-alpha              = 0.12
scrim                     = "#000000"
scrim-alpha               = 0.25
selected-background       = "#0071e3"
selected-background-alpha = 0.18
selected-text             = "#0071e3"
selected-border           = "#0071e3"
selected-border-alpha     = 0.35

[menu]
background                = "#ffffff"
background-alpha          = 0.95
text                      = "#1d1d1f"
border                    = "#000000"
border-alpha              = 0.12
scrim                     = "#000000"
scrim-alpha               = 0.25
selected-background       = "#0071e3"
selected-background-alpha = 0.16
selected-text             = "#0071e3"
selected-border           = "#0071e3"
selected-border-alpha     = 0.28
