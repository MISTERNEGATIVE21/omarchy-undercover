<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!--
  Omarchy Undercover - Windows 11 font rendering (fontconfig)
  License: GPL-3.0-or-later

  Prefers Segoe UI / Segoe UI Variable everywhere and uses Microsoft-style
  subpixel hinting so text renders the way it does on Windows 11.
-->
<fontconfig>
  <alias>
    <family>sans-serif</family>
    <prefer>
      <family>Segoe UI Variable Display</family>
      <family>Segoe UI Variable Text</family>
      <family>Segoe UI</family>
    </prefer>
  </alias>

  <alias>
    <family>Segoe UI Variable</family>
    <prefer>
      <family>Segoe UI Variable Display</family>
      <family>Segoe UI Variable Text</family>
      <family>Segoe UI</family>
    </prefer>
  </alias>

  <alias>
    <family>Segoe UI Display</family>
    <prefer><family>Segoe UI</family></prefer>
  </alias>

  <alias>
    <family>Consolas</family>
    <prefer>
      <family>CaskaydiaCove Nerd Font</family>
      <family>CaskaydiaMono Nerd Font</family>
      <family>DejaVu Sans Mono</family>
    </prefer>
  </alias>

  <match target="pattern">
    <test name="family"><string>Segoe UI Variable Display</string></test>
    <edit name="weight" mode="prepend" binding="strong"><const>medium</const></edit>
  </match>

  <match target="font">
    <edit name="antialias" mode="assign"><bool>true</bool></edit>
    <edit name="rgba" mode="assign"><const>rgb</const></edit>
    <edit name="hinting" mode="assign"><bool>true</bool></edit>
    <edit name="hintstyle" mode="assign"><const>hintslight</const></edit>
    <edit name="autohint" mode="assign"><bool>false</bool></edit>
    <edit name="lcdfilter" mode="assign"><const>lcddefault</const></edit>
  </match>
</fontconfig>
