# Input & Mouse Behavior
input {
    follow_mouse = 1
    mouse_refocus = true
}

misc {
    focus_on_activate = true
    mouse_move_enables_dpms = true
    animate_manual_resizes = true
}

# General Layout
general {
    gaps_in = 4
    gaps_out = 8
    border_size = 1
    col.active_border = rgba(0078d4ff) rgba(00b7c3ff) 45deg
}

# Decoration
decoration {
    rounding = 10
    blur {
        enabled = true
        size = 8
        passes = 2
        vibrancy = 0.2
    }
    shadow {
        enabled = true
        range = 24
        render_power = 3
        color = rgba(00000066)
    }
}

# Animations
animations {
    enabled = yes

    bezier = fluent, 0.1, 0.9, 0.2, 1.0
    bezier = fluentExit, 0.2, 1.0, 0.1, 1.0

    animation = windows, 1, 5, fluent
    animation = windowsIn, 1, 5, fluent, popin 90%
    animation = windowsOut, 1, 3, fluentExit, popin 90%
    animation = workspaces, 1, 4, fluent, slide
    animation = specialWorkspace, 1, 4, fluent, slidevert
    animation = layers, 1, 4, fluent, fade
}

# Keybindings for Windows 11 Mode
bindr = SUPER, SUPER_L, exec, omarchy-undercover-launcher
bind = SUPER, SPACE, exec, omarchy-undercover-launcher
bind = SUPER, d, exec, omarchy-undercover-show-desktop
bind = SUPER, m, exec, omarchy-undercover-minimize
bind = SUPER, i, exec, omarchy-undercover-settings
bind = SUPER, a, exec, omarchy-win11-notifications
bind = SUPER, n, exec, omarchy-win11-notifications
bind = SUPER, w, exec, omarchy-win11-widgets
bind = SUPER, b, exec, omarchy-undercover-toggle-bar
bind = SUPER ALT, b, exec, omarchy-undercover-autohide --toggle
bind = SUPER, TAB, exec, rofi -show window -theme ~/.config/omarchy-undercover/rofi/windows11.rasi
bind = ALT, F4, killactive,
bind = SUPER, e, exec, env GTK_THEME=Win11-Dark GTK_ICON_THEME=Fluent-dark nautilus --new-window computer:/// || thunar || nemo || dolphin || pcmanfm
bind = SUPER, l, exec, hyprlock || swaylock || loginctl lock-session
bind = SUPER, left, movewindow, l
bind = SUPER, right, movewindow, r
bind = SUPER, up, fullscreen, 1
bind = SUPER, down, togglefloating,
