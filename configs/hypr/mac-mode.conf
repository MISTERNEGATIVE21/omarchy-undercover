general {
    gaps_in = 6
    gaps_out = 12
    border_size = 1
    col.active_border = rgba(007aff66)
    col.inactive_border = rgba(00000000)
    layout = dwindle
}

decoration {
    rounding = 16
    active_opacity = 0.98
    inactive_opacity = 0.92
    fullscreen_opacity = 1.0

    shadow {
        enabled = true
        range = 42
        render_power = 4
        color = rgba(00000066)
    }

    blur {
        enabled = true
        size = 16
        passes = 4
        special = true
        noise = 0.015
        contrast = 1.25
        brightness = 1.05
        vibrancy = 0.40
        vibrancy_darkness = 0.25
        popups = true
    }
}

animations {
    enabled = true
    bezier = macFluid, 0.16, 1.0, 0.3, 1.0
    bezier = macSpring, 0.1, 0.9, 0.2, 1.0
    bezier = macEase, 0.25, 1.0, 0.5, 1.0
    bezier = macFade, 0.0, 0.0, 0.2, 1.0

    animation = global, 1, 6, macFluid
    animation = windows, 1, 6, macFluid
    animation = windowsIn, 1, 6, macFluid, popin 85%
    animation = windowsOut, 1, 4, macEase, popin 80%
    animation = windowsMove, 1, 6, macSpring
    animation = fadeIn, 1, 4, macFade
    animation = fadeOut, 1, 4, macFade
    animation = workspaces, 1, 5, macEase, slide
    animation = specialWorkspace, 1, 5, macFluid, slidevert
    animation = layersIn, 1, 4, macSpring, fade
    animation = layersOut, 1, 3, macEase, fade
}


# Window Rules
windowrulev2 = float, class:^(com.thisisgm.flea|flea|org.gnome.Nautilus|thunar|org.kde.dolphin|nemo|pcmanfm)$
windowrulev2 = size 1060 660, class:^(com.thisisgm.flea|flea|org.gnome.Nautilus|thunar|org.kde.dolphin|nemo|pcmanfm)$
windowrulev2 = center, class:^(com.thisisgm.flea|flea|org.gnome.Nautilus|thunar|org.kde.dolphin|nemo|pcmanfm)$
windowrulev2 = rounding 16, class:^(com.thisisgm.flea|flea|org.gnome.Nautilus|thunar|org.kde.dolphin|nemo|pcmanfm)$

# System Settings window rules (ensure always floating, centered, and popping up in front)
windowrulev2 = float, class:^(org.quickshell)$, title:^(System Settings)$
windowrulev2 = size 980 640, class:^(org.quickshell)$, title:^(System Settings)$
windowrulev2 = center, class:^(org.quickshell)$, title:^(System Settings)$
windowrulev2 = focusonactivate, class:^(org.quickshell)$, title:^(System Settings)$
windowrulev2 = float, class:^(org.omarchy.undercover.settings)$
windowrulev2 = size 1020 700, class:^(org.omarchy.undercover.settings)$
windowrulev2 = center, class:^(org.omarchy.undercover.settings)$
windowrulev2 = focusonactivate, class:^(org.omarchy.undercover.settings)$

# macOS Sequoia Keybindings
bind = SUPER, space, exec, rofi -show drun -theme ~/.config/rofi/mac.rasi
bind = SUPER, tab, exec, rofi -show window -theme ~/.config/rofi/mac.rasi
bind = SUPER, e, exec, omarchy-undercover-filemanager
bind = SUPER, n, exec, omarchy-mac-widgets
bind = SUPER, comma, exec, uwsm-app -- omarchy-undercover-settings
bind = SUPER, m, exec, omarchy-undercover-minimize
bind = SUPER, d, exec, omarchy-undercover-show-desktop
bind = SUPER CTRL, q, exec, hyprlock || swaylock || loginctl lock-session
bind = SUPER CTRL, left, exec, omarchy-undercover-snap left
bind = SUPER CTRL, right, exec, omarchy-undercover-snap right
bind = SUPER CTRL, up, exec, omarchy-undercover-snap up
bind = SUPER CTRL, down, exec, omarchy-undercover-snap down
bind = SUPER CTRL, space, exec, omarchy-undercover-snap menu

